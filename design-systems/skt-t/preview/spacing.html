<!doctype html>
<html lang="ko">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>SKT-T Spacing</title><link rel="stylesheet" href="../tokens.css" /><style>body{margin:0;padding:32px;font-family:var(--font-body);background:var(--surface-alt);color:var(--fg)}h1{margin:0 0 20px;font-size:28px}.stack{display:grid;gap:14px;max-width:840px}.item{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center;padding:16px;border-radius:16px;background:#fff;border:1px solid var(--border)}.bar{height:14px;border-radius:999px;background:var(--accent)}</style></head>
  <body><h1>SKT-T Spacing</h1><div class="stack"><div class="item"><strong>8px</strong><div class="bar" style="width:8px"></div></div><div class="item"><strong>16px</strong><div class="bar" style="width:16px"></div></div><div class="item"><strong>24px</strong><div class="bar" style="width:24px"></div></div><div class="item"><strong>32px</strong><div class="bar" style="width:32px"></div></div><div class="item"><strong>40px</strong><div class="bar" style="width:40px"></div></div><div class="item"><strong>48px</strong><div class="bar" style="width:48px"></div></div><div class="item"><strong>64px</strong><div class="bar" style="width:64px"></div></div></div></body>
</html>
