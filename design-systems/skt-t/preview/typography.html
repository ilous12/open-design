<!doctype html>
<html lang="ko">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>SKT-T Typography</title><link rel="stylesheet" href="../tokens.css" /><style>body{margin:0;padding:32px;background:#fff;color:var(--fg);font-family:var(--font-body)}section{max-width:960px;margin:0 auto}.row{padding:18px 0;border-bottom:1px solid var(--border)}.k{font-size:13px;color:var(--fg-muted);font-weight:700}.hero{font-size:52px;font-weight:800;letter-spacing:var(--tracking-tight);line-height:1.12}.sec{font-size:30px;font-weight:700}.card{font-size:20px;font-weight:700}.body{font-size:16px;line-height:1.55}.util{font-size:14px;font-weight:600}.cap{font-size:12px;color:var(--fg-muted)}</style></head>
  <body><section><div class="row"><div class="k">Hero / portal summary</div><div class="hero">내 상태를 먼저 보여주는 공식 통신 포털</div></div><div class="row"><div class="k">Section heading</div><div class="sec">요금 조회와 빠른 서비스</div></div><div class="row"><div class="k">Card title</div><div class="card">이번 달 청구요금</div></div><div class="row"><div class="k">Body</div><div class="body">데이터 선물하기, 요금제 변경, 분실 신고, 멤버십과 로밍 안내를 같은 계정 흐름 안에서 제공합니다.</div></div><div class="row"><div class="k">Utility label</div><div class="util">이용 회선 정보 · 고객지원 · 검색</div></div><div class="row"><div class="k">Caption</div><div class="cap">납부 예정일 7월 25일 · 처리 중 1건</div></div></section></body>
</html>
