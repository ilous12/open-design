<!doctype html><html><head><meta charset="utf-8"><title>AIR Colors</title><link rel="stylesheet" href="../tokens.css"><style>body{font-family:var(--font-body);margin:40px;color:var(--fg)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}.sw{border:1px solid var(--border);border-radius:16px;overflow:hidden}.c{height:96px}.t{padding:12px;font-weight:700}</style></head><body><h1>AIR Colors</h1><div class="grid"><div class="sw"><div class="c" style="background:var(--fg)"></div><div class="t">Black #0A0F0F</div></div><div class="sw"><div class="c" style="background:var(--accent)"></div><div class="t">AIR Blue #2A60F5</div></div><div class="sw"><div class="c" style="background:var(--surface-warm)"></div><div class="t">Pale Blue 100</div></div><div class="sw"><div class="c" style="background:var(--pale-blue-300)"></div><div class="t">Pale Blue 300</div></div></div></body></html>
