<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AIR Form</title><link rel="stylesheet" href="../../tokens.css"><style>body{margin:0;background:#f7fbff;font-family:var(--font-body);color:var(--fg)}main{max-width:760px;margin:0 auto;padding:40px 24px}.card{background:#fff;border:1px solid var(--border);border-radius:24px;padding:28px}.field{display:grid;gap:8px;margin-top:18px}label{font-size:14px;font-weight:700}input{min-height:48px;border:1px solid var(--border);border-radius:14px;padding:0 16px;background:#fff;font:inherit}.btn{display:inline-flex;min-height:48px;align-items:center;padding:0 22px;border-radius:9999px;background:var(--accent);color:#fff;font-weight:700;border:0;margin-top:22px}</style></head><body><main><section class="card"><img src="../../assets/logo.svg" alt="AIR" style="width:72px"><h1 style="font-size:32px;letter-spacing:var(--tracking-display)">Enter activation details</h1><div class="field"><label>Mobile number</label><input placeholder="010-0000-0000"></div><div class="field"><label>Delivery address</label><input placeholder="Enter your address"></div><button class="btn">Next step</button></section></main></body></html>
