<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>SKT-T Form</title><link rel="stylesheet" href="../../tokens.css"/><style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-body);background:var(--surface-alt);color:var(--fg)}.wrap{max-width:760px;margin:0 auto;padding:40px 24px}.panel{padding:28px;border-radius:24px;background:#fff;border:1px solid var(--border)}h1{margin:0;font-size:34px;line-height:1.2}.lead{margin:12px 0 0;color:var(--fg-muted)}.field{display:grid;gap:8px;margin-top:18px}label{font-size:14px;font-weight:700}input,select{min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--border);background:#fff;font:inherit}.actions{display:flex;gap:10px;margin-top:24px}.btn{min-height:46px;padding:0 18px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-weight:700}.btn-primary{background:var(--accent);color:#fff}.btn-secondary{background:var(--surface-alt-strong);color:var(--fg)}</style></head><body><main class="wrap"><section class="panel"><h1>Submit a support request</h1><p class="lead">Leave your inquiry type and line information so the support flow can guide you quickly.</p><div class="field"><label>Inquiry type</label><select><option>Billing review / payment</option><option>Loss report</option><option>Plan change</option><option>Roaming inquiry</option></select></div><div class="field"><label>Mobile number</label><input placeholder="010-0000-0000"/></div><div class="field"><label>Inquiry details</label><input placeholder="Describe the help you need"/></div><div class="actions"><a class="btn btn-primary" href="#">Submit request</a><a class="btn btn-secondary" href="#">Back</a></div></section></main></body></html>
