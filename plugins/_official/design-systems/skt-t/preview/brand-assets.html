  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>SKT-T Brand Assets</title><link rel="stylesheet" href="../tokens.css" /><style>body{margin:0;padding:32px;font-family:var(--font-body);background:#fff;color:var(--fg)}h1{margin:0 0 20px;font-size:28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{padding:20px;border:1px solid var(--border);border-radius:20px;background:linear-gradient(180deg,var(--surface-alt),#fff)}.box{min-height:160px;display:grid;place-items:center;border:1px dashed var(--border-strong);border-radius:12px;background:#fff}.logo{height:40px;width:auto}.pillrow{display:flex;gap:10px;flex-wrap:wrap}.pill{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:999px;background:var(--surface-alt-strong);font-weight:700}.pill.primary{background:var(--accent);color:#fff}.meta{margin-top:12px;font-size:14px;color:var(--fg-muted);line-height:1.5}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style></head>
