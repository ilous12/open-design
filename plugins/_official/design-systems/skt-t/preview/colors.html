<!doctype html>
<html lang="ko">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>SKT-T Colors</title><link rel="stylesheet" href="../tokens.css" /><style>body{margin:0;padding:32px;font-family:var(--font-body);background:var(--surface-alt);color:var(--fg)}h1{margin:0 0 16px;font-size:28px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid var(--border);border-radius:16px;overflow:hidden}.sw{height:88px}.meta{padding:12px;font-size:13px;font-weight:700}.meta span{display:block;margin-top:4px;color:var(--fg-muted);font-weight:500}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}</style></head>
  <body>
    <h1>SKT-T Colors</h1>
    <div class="grid">
      <div class="card"><div class="sw" style="background:#3617ce"></div><div class="meta">T Purple<span>#3617CE</span></div></div>
      <div class="card"><div class="sw" style="background:#4130df"></div><div class="meta">Purple Hover<span>#4130DF</span></div></div>
      <div class="card"><div class="sw" style="background:#f5f5f7"></div><div class="meta">Service Gray<span>#F5F5F7</span></div></div>
      <div class="card"><div class="sw" style="background:#eeeef4"></div><div class="meta">Gray Strong<span>#EEEEF4</span></div></div>
      <div class="card"><div class="sw" style="background:#f4f3fe"></div><div class="meta">Soft Tint<span>#F4F3FE</span></div></div>
      <div class="card"><div class="sw" style="background:#ffffff"></div><div class="meta">White<span>#FFFFFF</span></div></div>
      <div class="card"><div class="sw" style="background:#000000"></div><div class="meta" style="color:#fff">Ink<span style="color:#ddd">#000000</span></div></div>
      <div class="card"><div class="sw" style="background:#ff404e"></div><div class="meta">Alert Coral<span>#FF404E</span></div></div>
    </div>
  </body>
</html>
